server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions_copy.yaml


# the endpoint to which the logs will be sent
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: telemetry_logs
    static_configs:
      # no need to specify the port here since we're reading from files
      - targets:
          - localhost
      # the labels to attach to the logs, and the path to the log files
        labels:
          job: telemetry
          __path__: /home/john/proj/atmosdemo/data/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            ts: event_timestamp
            value: value

      - timestamp:
          source: ts
          format: RFC3339